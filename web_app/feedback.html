<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LARPABLE. — Feedback</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <main class="d-feedback-page">
    <section class="d-feedback-card" id="platform-feedback-card">
      <p class="d-feedback-eyebrow">Your experience</p>
      <h1>Share feedback</h1>
      <p class="d-feedback-copy">Have you found help, or found an opportunity to help someone else through LARPABLE?</p>
      <div id="platform-feedback-content"><p>Loading…</p></div>
    </section>
  </main>
  <script src="/js/utils.js"></script>
  <script src="/js/data.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/feedback-page.js"></script>
  <script>
    (async () => {
      await App.init();
      if (!App.requireAuth()) return;
      App.setupUserMenu();
      await FeedbackPage.init();
    })();
  </script>
</body>
</html>
