<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LARPABLE. — Log in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="d-auth">
    <div class="d-auth-card">
      <div class="d-auth-title">Welcome back</div>
      <div class="d-auth-sub">Log in to your LARPABLE. account</div>
      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="d-form-group">
          <label class="d-label">Username</label>
          <input type="text" class="d-input" id="login-username" placeholder="Enter your username" required autocomplete="username">
        </div>
        <div class="d-form-group">
          <label class="d-label">Password</label>
          <input type="password" class="d-input" id="login-password" placeholder="Enter your password" required autocomplete="current-password">
        </div>
        <div id="login-error" style="color:var(--error); font-size:0.82rem; margin-bottom:12px; display:none;"></div>
        <button type="submit" class="d-btn d-btn-accent" style="width:100%;">Log in</button>
      </form>
      <div class="d-auth-footer">
        Don't have an account? <a href="/signup">Sign up</a>
      </div>
    </div>
  </div>

  <script>
    // Already logged in → straight to the feed
    (async () => {
      try {
        const res = await fetch('/api/auth/me', { credentials: 'same-origin' });
        if (res.ok) window.location.href = '/feed';
      } catch (e) {}
    })();

    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value;
      const errEl = document.getElementById('login-error');
      const btn = e.target.querySelector('button[type="submit"]');

      errEl.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Logging in...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ username, password })
        });

        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          errEl.textContent = data.error || 'Invalid username or password.';
          errEl.style.display = 'block';
          return;
        }

        // Login successful — cookie is set by server
        window.location.href = '/feed';
      } catch (err) {
        errEl.textContent = err.message || 'Login failed. Please try again.';
        errEl.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Log in';
      }
    }
  </script>
  <script src="/scaling.js"></script>
</body>
</html>
