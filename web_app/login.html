<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LARPABLE. — Log in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-primary:    #f8f3ed;
      --bg-secondary:  #ffffff;
      --fg-primary:    #1e1b18;
      --fg-secondary:  #6b635d;
      --fg-tertiary:   #a09992;
      --accent:        #ff6b6b;
      --accent-hover:  #e55a5a;
      --border:        #e4ded6;
      --font-family:   'Space Grotesk', system-ui, sans-serif;
      --radius-md:     10px;
      --transition:    0.18s ease;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg-primary);
      font-family: var(--font-family);
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .login {
      width: 100%;
      max-width: 340px;
      padding: 0 1.5rem;
    }

    .logo {
      font-size: clamp(2.5rem, 6vw, 4rem);
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.04em;
      text-align: center;
      margin-bottom: 2.5rem;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .field label {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--fg-secondary);
    }

    .field input {
      font-family: var(--font-family);
      font-size: 0.88rem;
      color: var(--fg-primary);
      background: var(--bg-secondary);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      padding: 0.6rem 0.85rem;
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition);
    }

    .field input::placeholder { color: var(--fg-tertiary); }

    .field input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(255, 107, 107, 0.1);
    }

    .btn {
      font-family: var(--font-family);
      font-weight: 600;
      font-size: 0.92rem;
      letter-spacing: -0.01em;
      border-radius: var(--radius-md);
      border: 2px solid var(--fg-primary);
      cursor: pointer;
      transition: all var(--transition);
      padding: 0.65rem 1.3rem;
      margin-top: 0.25rem;
      background: var(--fg-primary);
      color: var(--bg-primary);
    }
    .btn:hover { opacity: 0.88; }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: var(--radius-md);
      padding: 0.6rem 0.85rem;
      font-size: 0.82rem;
      color: #dc2626;
      display: none;
    }
    .error.show { display: block; }

    .signup {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: var(--fg-secondary);
    }

    .signup a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      transition: color var(--transition);
    }
    .signup a:hover { color: var(--accent-hover); }
  </style>
</head>
<body>
  <div class="login">
    <div class="logo">LARPABLE.</div>

    <div class="error" id="error"></div>

    <form id="loginForm">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" type="text" placeholder="your username" autocomplete="username" autofocus required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="your password" autocomplete="current-password" required>
      </div>
      <button class="btn" type="submit" id="submitBtn">Log in</button>
    </form>

    <div class="signup">
      Don't have an account? <a href="/signup">Sign up</a>
    </div>
  </div>

  <script>
    // If already logged in, go to feed
    (async () => {
      try {
        const res = await fetch('/api/auth/me', { credentials: 'same-origin' });
        if (res.ok) window.location.href = '/feed';
      } catch (e) {}
    })();

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('error');
      const btn = document.getElementById('submitBtn');
      
      errorEl.classList.remove('show');
      btn.disabled = true;
      btn.textContent = 'Logging in...';
      
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ username, password })
        });
        
        const data = await res.json();
        
        if (!res.ok) {
          errorEl.textContent = data.error || 'Login failed';
          errorEl.classList.add('show');
          btn.disabled = false;
          btn.textContent = 'Log in';
          return;
        }
        
        // Login successful — cookie is set by server
        window.location.href = '/feed';
      } catch (err) {
        errorEl.textContent = 'Connection error. Please try again.';
        errorEl.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Log in';
      }
    });
  </script>
</body>
</html>
