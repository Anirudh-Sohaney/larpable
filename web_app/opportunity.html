<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LARPABLE. — Opportunity</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/styles.css">
  <style>
    .d-detail-header{padding-bottom:30px;border-bottom:1px solid var(--border)}
    .d-detail-kicker{display:flex;align-items:center;gap:8px;margin-bottom:14px;color:var(--fg-tertiary);font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
    .d-detail-kicker .d-detail-type{margin:0}.d-detail-dot{color:var(--accent)}
    .d-detail-issuer{display:flex;align-items:center;gap:9px;margin:0}.d-detail-issuer-mark{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--fg-primary);color:var(--bg-secondary);font-size:.64rem;font-weight:700}
    .d-detail-story{padding:25px 0;border-top:1px solid var(--border)}.d-detail-story:first-child{border-top:0;padding-top:0}
    .d-detail-section-heading{display:flex;align-items:center;gap:12px;margin-bottom:15px}.d-detail-eyebrow{color:var(--fg-tertiary);font-size:.68rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase}.d-detail-rule{width:40px;height:1px;background:var(--accent)}
    .d-detail-facts{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
    .d-detail-fact{padding:15px 16px 16px 0;min-width:0}.d-detail-fact+.d-detail-fact{padding-left:16px;border-left:1px solid var(--border)}.d-detail-fact .d-detail-info-label{margin-bottom:5px}.d-detail-fact .d-detail-info-value{line-height:1.45}
    .d-detail-contact{padding:20px;border-radius:var(--radius-lg);background:var(--bg-tertiary);color:var(--fg-primary)}.d-detail-contact h2{margin-bottom:8px;font-size:.86rem;color:var(--fg-primary)}.d-detail-contact p{margin-bottom:14px;color:var(--fg-secondary);font-size:.78rem}.d-detail-contact a{display:block;padding:9px 11px;margin-top:5px;border-radius:var(--radius-sm);background:var(--accent);color:#fff;font-size:.82rem;word-break:break-all}.d-detail-contact a:hover{background:var(--accent-hover)}
    .d-admin{display:none;padding:18px;border:1px solid #fecaca;border-radius:var(--radius-md);background:#fff5f5}.d-admin h2{margin-bottom:8px;color:#dc3545;font-size:.86rem}.d-admin p{margin-bottom:12px;color:var(--fg-secondary);font-size:.78rem}.d-admin-row{display:flex;gap:8px;flex-wrap:wrap}.d-admin button{padding:7px 13px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-secondary);font:600 .78rem var(--font-family);cursor:pointer}.d-admin button:hover{border-color:var(--accent);color:var(--accent)}.d-admin .danger{border-color:#dc3545;color:#dc3545}
    .d-apply-btn{display:block;width:100%;margin-top:14px;padding:14px;border:0;border-radius:var(--radius-md);background:var(--accent);color:#fff;font:700 .95rem var(--font-family);cursor:pointer}.d-apply-btn:disabled{background:var(--fg-tertiary);cursor:default}.d-applied-btn:disabled{opacity:.45;cursor:default}.d-applicant-row{width:100%;display:flex;align-items:center;gap:12px;padding:16px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--bg-secondary);text-align:left;font:600 .95rem var(--font-family);cursor:pointer}.d-applicant-details{margin:0 0 12px 50px;padding:14px 16px;border:1px solid var(--border);border-radius:0 0 var(--radius-md) var(--radius-md);background:var(--bg-tertiary);line-height:1.6}.d-applicant-details[hidden],#applicants-view[hidden]{display:none}#detail.show-applicants>:not(#applicants-view){display:none!important}
    .d-applicant-experiences{margin-top:14px}.d-applicant-experiences h3{margin:0 0 8px;font-size:.82rem}.d-applicant-experience{margin-top:8px;padding:12px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--bg-secondary)}.d-applicant-experience-title{font-size:.86rem;font-weight:700}.d-applicant-experience-meta{font-size:.74rem;color:var(--fg-tertiary)}.d-applicant-experience p{margin:8px 0;white-space:pre-wrap;font-size:.82rem;color:var(--fg-secondary)}.d-applicant-experience-skills{display:flex;flex-wrap:wrap;gap:5px}.d-applicant-experience-skills .is-match{border-color:var(--accent);background:var(--accent-light);color:var(--accent)}
    @media(max-width:640px){.d-detail-facts{display:block}.d-detail-fact{padding:13px 0}.d-detail-fact+.d-detail-fact{padding-left:0;border-top:1px solid var(--border);border-left:0}}
  </style>
</head>
<body>
  <main class="d-detail">
    <div id="detail"><div class="d-empty">Loading opportunity...</div></div>
  </main>
  <script src="/js/utils.js"></script><script src="/js/data.js"></script><script src="/js/app.js"></script>
  <script>
    const esc = value => { const d = document.createElement('div'); d.textContent = value == null ? '' : String(value); return d.innerHTML; };
    const text = value => value == null ? '' : String(value);
    const linkValue = link => typeof link === 'string' ? link : (link && (link.url || link.href || link.label)) || '';
    const posted = iso => { if (!iso) return ''; const diff = Date.now() - new Date(iso).getTime(); if (!Number.isFinite(diff)) return ''; const mins = Math.floor(diff / 60000); if (mins < 1) return 'Posted just now'; if (mins < 60) return `Posted ${mins}m ago`; const hours = Math.floor(mins / 60); if (hours < 24) return `Posted ${hours}h ago`; const days = Math.floor(hours / 24); return `Posted ${days}d ago`; };
    const initials = name => text(name).trim().split(/\s+/).map(part => part[0]).join('').slice(0, 2).toUpperCase() || '?';
    const renderRelevantExperiences = person => {
      const experiences = Array.isArray(person.experiences) ? person.experiences : [];
      if (!experiences.length) return '<section class="d-applicant-experiences"><h3>Relevant experience</h3><span style="font-size:.8rem;color:var(--fg-tertiary);">No matching experiences.</span></section>';
      return `<section class="d-applicant-experiences"><h3>Relevant experience</h3>${experiences.map(experience => {
        const matched = new Set(Array.isArray(experience.matching_skills) ? experience.matching_skills : []);
        const type = { project: 'Project', internship: 'Internship', job: 'Job' }[experience.type] || experience.type || '';
        return `<div class="d-applicant-experience"><div class="d-applicant-experience-title">${esc(experience.title || 'Untitled')}</div><div class="d-applicant-experience-meta">${esc(type)}${experience.company_name ? ` · ${esc(experience.company_name)}` : ''}</div><p>${esc(experience.description || '')}</p><div class="d-applicant-experience-skills">${(Array.isArray(experience.skills) ? experience.skills : []).map(skill => `<span class="d-chip${matched.has(skill) ? ' is-match' : ''}">${esc(skill)}</span>`).join('')}</div></div>`;
      }).join('')}</section>`;
    };

    (async () => {
      await App.init();
      App.setupUserMenu();
      const id = new URLSearchParams(window.location.search).get('id');
      const root = document.getElementById('detail');
      if (!id) { root.innerHTML = '<div class="d-empty">Opportunity not found.</div>'; return; }
      try {
        const response = await fetch('/api/opportunities/' + encodeURIComponent(id) + (location.hash === '#applied' ? '?view=applications' : ''), { credentials: 'same-origin' });
        if (!response.ok) { root.innerHTML = '<div class="d-empty">Opportunity not found.</div>'; return; }
        const data = await response.json();
        const fields = data.fields || {};
        const issuer = data.issuer || {};
        const kind = data.type || 'project';
        const name = issuer.name || fields.issuer_name || 'Unknown';
        const field = fields.industry || fields.nonprofit_field || fields.field || '';
        const loc = typeof fields.location === 'object' ? (fields.location.display || [fields.location.city, fields.location.state, fields.location.country].filter(Boolean).join(', ')) : fields.location;
        const links = (Array.isArray(fields.contact_links) ? fields.contact_links : (fields.contact ? [fields.contact] : [])).map(linkValue).filter(Boolean);
        const typeLabel = { project: 'Project', nonprofit: 'Nonprofit', company: 'Company' }[kind] || kind;
        const skills = Array.isArray(fields.skills) ? fields.skills : [];
        document.title = 'LARPABLE. — ' + (fields.title || 'Opportunity');
        
        // Check saved state using the currently initialized App data
        const currentUser = DataStore.getCurrentUser();
        const isSaved = currentUser?.saved_posts?.includes(id);
        const ownsPost = !!currentUser && currentUser.id === data.created_by;

        root.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px;">
            <a class="d-detail-back" href="/feed" style="margin-bottom:0;">← Back to feed</a>
            <div style="display:flex;gap:8px;align-items:center;">${currentUser ? `<button class="d-btn d-btn-sm" id="detail-save-btn" type="button">${isSaved ? '★ Saved' : '☆ Save'}</button>` : ''}${ownsPost ? `<button class="d-btn d-btn-sm d-applied-btn" id="detail-applied-btn" type="button" ${data.application?.count ? '' : 'disabled'}>Applied (${data.application?.count || 0})${data.application?.has_unread ? ' !' : ''}</button>` : ''}</div>
          </div>
          <section class="d-detail-header">
            <div class="d-detail-kicker"><span class="d-detail-type d-badge d-badge--${esc(kind)}">${esc(typeLabel)}</span><span class="d-detail-dot">·</span><span>${esc(fields.industry || fields.nonprofit_field || 'Student-led')}</span></div>
            <h1 class="d-detail-title">${esc(fields.title || 'Untitled opportunity')}</h1>
            <div class="d-detail-issuer"><span class="d-detail-issuer-mark">${esc(initials(name))}</span><span>Posted by <strong>${esc(name)}</strong>${fields.issuer_context ? ' · ' + esc(fields.issuer_context) : ''}</span></div>
          </section>
          <section class="d-detail-story"><div class="d-detail-section-heading"><span class="d-detail-eyebrow">About this opportunity</span><span class="d-detail-rule"></span></div><p class="d-detail-desc">${esc(fields.description || 'No description provided.')}</p></section>
          ${fields.looking_for ? `<section class="d-detail-looking-for"><div class="d-detail-looking-for-label">◉ &nbsp;Looking for</div><div class="d-detail-looking-for-value">${esc(fields.looking_for)}</div></section>` : ''}
          ${skills.length ? `<section class="d-detail-story"><div class="d-detail-section-heading"><span class="d-detail-eyebrow">Skills needed</span><span class="d-detail-rule"></span></div><div class="d-detail-skills">${skills.map(skill => `<span class="d-chip">${esc(skill)}</span>`).join('')}</div></section>` : ''}
          ${fields.details ? `<section class="d-detail-story"><div class="d-detail-section-heading"><span class="d-detail-eyebrow">Additional details</span><span class="d-detail-rule"></span></div><p class="d-detail-desc">${esc(fields.details)}</p></section>` : ''}
          <section class="d-detail-story"><div class="d-detail-section-heading"><span class="d-detail-eyebrow">Details</span><span class="d-detail-rule"></span></div><div class="d-detail-facts"><div class="d-detail-fact"><div class="d-detail-info-label">Location</div><div class="d-detail-info-value">${esc(loc || 'Remote')}${fields.remote ? '<span class="d-detail-fact-note">Remote OK</span>' : ''}</div></div><div class="d-detail-fact"><div class="d-detail-info-label">${kind === 'nonprofit' ? 'Field' : 'Industry'}</div><div class="d-detail-info-value">${esc(field || '—')}</div></div><div class="d-detail-fact"><div class="d-detail-info-label">Posted</div><div class="d-detail-info-value">${esc(posted(data.created_at).replace(/^Posted /, '') || '—')}</div></div></div></section>
                    <section class="d-detail-story"><div class="d-detail-contact"><h2>Contact / sign-up</h2><p>Reach out to the person behind this opportunity.</p><div>${links.length ? links.map(link => /^https?:\/\//i.test(link) ? `<a href="${esc(link)}" target="_blank" rel="noopener">${esc(link)}</a>` : `<a href="mailto:${esc(link)}">${esc(link)}</a>`).join('') : '<span>No contact link provided.</span>'}</div></div></section>
          ${currentUser && !ownsPost ? `<button id="apply-now-btn" class="d-apply-btn" type="button" ${data.application?.applied ? 'disabled' : ''}>${data.application?.applied ? 'Applied' : 'Apply now'}</button><p id="apply-error" role="alert" style="color:var(--error);font-size:.8rem;margin-top:8px;"></p>` : ''}
          <section class="d-detail-story">
            <div class="d-detail-section-heading">
              <span class="d-detail-eyebrow">Comments</span>
              <span class="d-detail-rule"></span>
            </div>
            <div id="comments-list" style="margin-bottom: 20px;">
              ${(fields.comments || []).length ? (fields.comments || []).map(c => `
                <div class="comment-block" id="comment-${esc(c.id)}" data-comment-id="${esc(c.id)}" style="display: flex; gap: 12px; margin-bottom: 24px;">
                  <div style="flex-shrink: 0;">
                    <div class="d-detail-issuer-mark" style="background: var(--accent-light); color: var(--accent); width: 38px; height: 38px; font-size: 0.8rem;">${esc(initials(c.user_name))}</div>
                  </div>
                  <div style="flex: 1; min-width: 0;">
                    <div style="background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 0 var(--radius-lg) var(--radius-lg) var(--radius-lg); padding: 14px 18px; box-shadow: 0 2px 8px var(--shadow);">
                      <div style="display: flex; justify-content: space-between; margin-bottom: 6px; align-items: baseline;">
                        <strong style="font-size: 0.9rem; color: var(--fg-primary);">${esc(c.user_name)}</strong>
                        <span style="font-size: 0.72rem; color: var(--fg-tertiary);">${esc(posted(c.created_at))}</span>
                      </div>
                      <p style="font-size: 0.92rem; color: var(--fg-secondary); margin: 0; line-height: 1.5; white-space: pre-wrap;">${esc(c.text)}</p>
                    </div>
                    
                    ${App.isAuthenticated() ? `<button class="d-btn-ghost reply-btn" style="font-size: 0.75rem; margin-top: 6px; padding: 4px 10px;">Reply</button>` : ''}
                    
                    <div class="replies-list" style="margin-top: 14px; display: flex; flex-direction: column; gap: 14px;">
                      ${(c.replies || []).map(r => `
                        <div style="display: flex; gap: 10px;">
                          <div style="flex-shrink: 0;">
                            <div class="d-detail-issuer-mark" style="background: var(--bg-tertiary); color: var(--fg-secondary); width: 28px; height: 28px; font-size: 0.65rem;">${esc(initials(r.user_name))}</div>
                          </div>
                          <div style="flex: 1; min-width: 0;">
                            <div style="background: var(--bg-tertiary); border-radius: 0 var(--radius-md) var(--radius-md) var(--radius-md); padding: 12px 16px;">
                              <div style="display: flex; justify-content: space-between; margin-bottom: 4px; align-items: baseline;">
                                <strong style="font-size: 0.82rem; color: var(--fg-primary);">${esc(r.user_name)}</strong>
                                <span style="font-size: 0.68rem; color: var(--fg-tertiary);">${esc(posted(r.created_at))}</span>
                              </div>
                              <p style="font-size: 0.88rem; color: var(--fg-secondary); margin: 0; line-height: 1.45; white-space: pre-wrap;">${esc(r.text)}</p>
                            </div>
                          </div>
                        </div>
                      `).join('')}
                    </div>
                  </div>
                </div>
              `).join('') : '<p class="d-detail-desc" id="no-comments-msg">No comments yet. Be the first to ask a question!</p>'}
            </div>
            ${App.isAuthenticated() ? `
              <div style="margin-top: 15px; padding: 15px; background: var(--bg-tertiary); border-radius: var(--radius-md);">
                <textarea id="comment-text" class="d-textarea" placeholder="Add a comment... (max 200 words)" style="margin-bottom: 10px; min-height: 60px;"></textarea>
                <div style="display: flex; justify-content: space-between; align-items: center;">
                  <button id="submit-comment" class="d-btn d-btn-sm d-btn-accent">Post Comment</button>
                  <span id="comment-word-count" style="font-size: 0.7rem; color: var(--fg-tertiary);">0 / 200 words</span>
                </div>
                <div id="comment-error" style="color: var(--error); font-size: 0.8rem; margin-top: 8px; display: none;"></div>
              </div>
            ` : `
              <div style="margin-top: 15px; padding: 15px; background: var(--bg-tertiary); border-radius: var(--radius-md); text-align: center;">
                <p style="font-size: 0.85rem; color: var(--fg-secondary); margin-bottom: 10px;">Log in to join the conversation.</p>
                <a href="/login" class="d-btn d-btn-sm">Log in</a>
              </div>
            `}
          </section>
          <section class="d-admin" id="admin-controls"><h2 id="admin-title">Admin controls</h2><p id="admin-desc">This opportunity can be managed from here.</p><div class="d-admin-row"><button id="admin-edit">Edit</button><button class="danger" id="admin-delete">Delete</button><button id="admin-user">View user</button></div></section>`;

        const applyBtn = document.getElementById('apply-now-btn');
        if (applyBtn) applyBtn.onclick = async () => {
          applyBtn.disabled = true;
          applyBtn.textContent = 'Applying...';
          try {
            const result = await fetch(`/api/opportunities/${encodeURIComponent(id)}/applications`, { method: 'POST', credentials: 'same-origin' });
            const body = await result.json();
            if (!result.ok) throw new Error(body.error || 'Could not apply');
            applyBtn.textContent = 'Applied';
          } catch (error) {
            applyBtn.disabled = false;
            applyBtn.textContent = 'Apply now';
            document.getElementById('apply-error').textContent = error.message;
          }
        };

        const appliedBtn = document.getElementById('detail-applied-btn');
        if (appliedBtn) {
          root.insertAdjacentHTML('beforeend', `<section id="applicants-view" hidden><a href="#" class="d-detail-back" id="back-to-post">← Back to post</a><h1 class="d-detail-title" style="margin-bottom:24px;">Applied</h1><div id="applicant-list"></div></section>`);
          document.getElementById('back-to-post').onclick = event => {
            event.preventDefault();
            root.classList.remove('show-applicants');
            document.getElementById('applicants-view').hidden = true;
            history.replaceState(null, '', location.pathname + location.search);
            // A direct applicant notification opens the list first. Mark
            // comments read only when the owner actually returns to the post.
            fetch(`/api/opportunities/${encodeURIComponent(id)}`, { credentials: 'same-origin' }).then(() =>
              fetch('/api/opportunities/mine', { credentials: 'same-origin' })).then(r => r.json()).then(mine => {
              if (!mine.opportunities?.some(post => post.has_unread_comments || post.has_unread_applications)) document.querySelector('.nav-yours-badge')?.remove();
            }).catch(console.error);
          };
          const showApplicants = async () => {
            const response = await fetch(`/api/opportunities/${encodeURIComponent(id)}/applications`, { credentials: 'same-origin' });
            if (!response.ok) return;
            const { applicants } = await response.json();
            const list = document.getElementById('applicant-list');
            list.innerHTML = applicants.map((person, index) => `<div><button type="button" class="d-applicant-row" data-index="${index}" aria-expanded="false"><span class="d-detail-issuer-mark" style="width:36px;height:36px;">${esc(initials(person.name))}</span><span>${esc(person.name)}</span></button><div class="d-applicant-details" hidden><strong>${esc(person.name)}</strong><div>Grade: ${esc(person.grade || '—')}</div><div>Skills: ${esc((person.skills || []).join(', ') || '—')}</div><div>Email: ${esc(person.email || '—')}</div>${renderRelevantExperiences(person)}</div></div>`).join('');
            list.onclick = event => {
              const button = event.target.closest('.d-applicant-row');
              if (!button) return;
              const details = button.nextElementSibling;
              details.hidden = !details.hidden;
              button.setAttribute('aria-expanded', String(!details.hidden));
            };
            document.getElementById('applicants-view').hidden = false;
            root.classList.add('show-applicants');
            history.replaceState(null, '', location.pathname + location.search + '#applied');
            window.scrollTo(0, 0);
            const seen = await fetch(`/api/opportunities/${encodeURIComponent(id)}/applications/seen`, { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ applicant_ids: applicants.map(person => person.id) }) });
            if (seen.ok) {
              appliedBtn.textContent = `Applied (${applicants.length})`;
              const mine = await fetch('/api/opportunities/mine', { credentials: 'same-origin' }).then(r => r.json());
              if (!mine.opportunities?.some(post => post.has_unread_comments || post.has_unread_applications)) document.querySelector('.nav-yours-badge')?.remove();
            }
          };
          appliedBtn.onclick = () => showApplicants().catch(console.error);
          if (location.hash === '#applied' && !appliedBtn.disabled) showApplicants().catch(console.error);
        }
        
        
        const saveBtn = document.getElementById('detail-save-btn');
        if (saveBtn) {
          saveBtn.onclick = async () => {
            const nowSaved = await DataStore.toggleSavePost(id);
            saveBtn.textContent = nowSaved ? '★ Saved' : '☆ Save';
          };
        }

        const commentText = document.getElementById('comment-text');
        const submitComment = document.getElementById('submit-comment');
        const commentError = document.getElementById('comment-error');
        const wordCount = document.getElementById('comment-word-count');

        if (commentText && submitComment) {

          document.getElementById('comments-list')?.addEventListener('click', async (e) => {
            if (e.target.classList.contains('reply-btn')) {
              const block = e.target.closest('.comment-block');
              const commentId = block.getAttribute('data-comment-id');
              
              if (block.querySelector('.reply-box')) return;
              
              const replyHtml = `
                <div class="reply-box" style="margin-top: 10px; margin-left: 20px;">
                  <textarea class="d-textarea reply-text" placeholder="Write a reply... (max 200 words)" style="min-height: 50px; font-size: 0.85rem; margin-bottom: 6px;"></textarea>
                  <div style="display: flex; justify-content: space-between; align-items: center;">
                    <div>
                      <button class="d-btn d-btn-sm d-btn-accent submit-reply">Post Reply</button>
                      <button class="d-btn d-btn-sm cancel-reply" style="margin-left: 4px;">Cancel</button>
                    </div>
                    <span class="reply-error" style="color: var(--error); font-size: 0.75rem; display: none;"></span>
                  </div>
                </div>
              `;
              
              e.target.insertAdjacentHTML('afterend', replyHtml);
              e.target.style.display = 'none';
            }
            
            if (e.target.classList.contains('cancel-reply')) {
              const box = e.target.closest('.reply-box');
              const replyBtn = box.parentElement.querySelector('.reply-btn');
              if (replyBtn) replyBtn.style.display = 'inline-block';
              box.remove();
            }
            
            if (e.target.classList.contains('submit-reply')) {
              const box = e.target.closest('.reply-box');
              const textEl = box.querySelector('.reply-text');
              const errEl = box.querySelector('.reply-error');
              const text = textEl.value.trim();
              const words = text.split(/\s+/).filter(w => w.length > 0);
              
              if (!text) return;
              if (words.length > 200) {
                errEl.textContent = 'Limit 200 words';
                errEl.style.display = 'inline-block';
                return;
              }
              
              const block = e.target.closest('.comment-block');
              const commentId = block.getAttribute('data-comment-id');
              e.target.disabled = true;
              e.target.textContent = 'Posting...';
              errEl.style.display = 'none';
              
              try {
                const res = await fetch(`/api/opportunities/${encodeURIComponent(data.id)}/comments/${encodeURIComponent(commentId)}/replies`, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ text })
                });
                
                const resData = await res.json();
                if (res.ok) {
                  const r = resData.reply;
                  const newReplyHtml = `
                    <div style="display: flex; gap: 10px; margin-top: 14px;">
                      <div style="flex-shrink: 0;">
                        <div class="d-detail-issuer-mark" style="background: var(--bg-tertiary); color: var(--fg-secondary); width: 28px; height: 28px; font-size: 0.65rem;">${esc(initials(r.user_name))}</div>
                      </div>
                      <div style="flex: 1; min-width: 0;">
                        <div style="background: var(--bg-tertiary); border-radius: 0 var(--radius-md) var(--radius-md) var(--radius-md); padding: 12px 16px;">
                          <div style="display: flex; justify-content: space-between; margin-bottom: 4px; align-items: baseline;">
                            <strong style="font-size: 0.82rem; color: var(--fg-primary);">${esc(r.user_name)}</strong>
                            <span style="font-size: 0.68rem; color: var(--fg-tertiary);">Just now</span>
                          </div>
                          <p style="font-size: 0.88rem; color: var(--fg-secondary); margin: 0; line-height: 1.45; white-space: pre-wrap;">${esc(r.text)}</p>
                        </div>
                      </div>
                    </div>
                  `;
                  
                  const repliesList = block.querySelector('.replies-list');
                  if (repliesList) repliesList.insertAdjacentHTML('beforeend', newReplyHtml);
                  
                  const replyBtn = block.querySelector('.reply-btn');
                  if (replyBtn) replyBtn.style.display = 'inline-block';
                  box.remove();
                } else {
                  errEl.textContent = resData.error || 'Failed to reply';
                  errEl.style.display = 'inline-block';
                  e.target.disabled = false;
                  e.target.textContent = 'Post Reply';
                }
              } catch (err) {
                errEl.textContent = 'Network error';
                errEl.style.display = 'inline-block';
                e.target.disabled = false;
                e.target.textContent = 'Post Reply';
              }
            }
          });

          commentText.addEventListener('input', () => {
            const words = commentText.value.trim().split(/\s+/).filter(w => w.length > 0);
            wordCount.textContent = `${words.length} / 200 words`;
            if (words.length > 200) {
              wordCount.style.color = 'var(--error)';
            } else {
              wordCount.style.color = 'var(--fg-tertiary)';
            }
          });

          submitComment.addEventListener('click', async () => {
            const text = commentText.value.trim();
            const words = text.split(/\s+/).filter(w => w.length > 0);
            
            if (!text) return;
            if (words.length > 200) {
              commentError.textContent = 'Comment exceeds 200 words limit.';
              commentError.style.display = 'block';
              return;
            }
            
            submitComment.disabled = true;
            submitComment.textContent = 'Posting...';
            commentError.style.display = 'none';

            try {
              const res = await fetch(`/api/opportunities/${encodeURIComponent(data.id)}/comments`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text })
              });
              
              const resData = await res.json();
              if (res.ok) {
                // Prepend to UI
                const list = document.getElementById('comments-list');
                const noComments = document.getElementById('no-comments-msg');
                if (noComments) noComments.remove();
                
                const c = resData.comment;
                const newCommentHtml = `
                  <div class="comment-block" id="comment-${esc(c.id)}" data-comment-id="${esc(c.id)}" style="display: flex; gap: 12px; margin-bottom: 24px;">
                    <div style="flex-shrink: 0;">
                      <div class="d-detail-issuer-mark" style="background: var(--accent-light); color: var(--accent); width: 38px; height: 38px; font-size: 0.8rem;">${esc(initials(c.user_name))}</div>
                    </div>
                    <div style="flex: 1; min-width: 0;">
                      <div style="background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 0 var(--radius-lg) var(--radius-lg) var(--radius-lg); padding: 14px 18px; box-shadow: 0 2px 8px var(--shadow);">
                        <div style="display: flex; justify-content: space-between; margin-bottom: 6px; align-items: baseline;">
                          <strong style="font-size: 0.9rem; color: var(--fg-primary);">${esc(c.user_name)}</strong>
                          <span style="font-size: 0.72rem; color: var(--fg-tertiary);">Just now</span>
                        </div>
                        <p style="font-size: 0.92rem; color: var(--fg-secondary); margin: 0; line-height: 1.5; white-space: pre-wrap;">${esc(c.text)}</p>
                      </div>
                      <button class="d-btn-ghost reply-btn" style="font-size: 0.75rem; margin-top: 6px; padding: 4px 10px;">Reply</button>
                      <div class="replies-list" style="margin-top: 14px; display: flex; flex-direction: column; gap: 14px;"></div>
                    </div>
                  </div>
                `;
                list.insertAdjacentHTML('beforeend', newCommentHtml);
                
                commentText.value = '';
                wordCount.textContent = '0 / 200 words';
                wordCount.style.color = 'var(--fg-tertiary)';
              } else {
                commentError.textContent = resData.error || 'Failed to post comment.';
                commentError.style.display = 'block';
              }
            } catch (err) {
              commentError.textContent = 'Network error. Please try again.';
              commentError.style.display = 'block';
            } finally {
              submitComment.disabled = false;
              submitComment.textContent = 'Post Comment';
            }
          });
        }


        const auth = await fetch('/api/auth/me', { credentials: 'include' });
        const authData = auth.ok ? await auth.json() : {};
        const isAdmin = authData.user?.role === 'admin';
        if (isAdmin) {
          document.getElementById('admin-controls').style.display = 'block';
          document.getElementById('admin-edit').onclick = () => { window.location.href = `/create_student?type=${encodeURIComponent(kind)}&edit=${encodeURIComponent(data.id)}`; };
          document.getElementById('admin-user').onclick = () => { if (data.created_by) window.location.href = `/admin_user?id=${encodeURIComponent(data.created_by)}`; };
          document.getElementById('admin-delete').onclick = async () => {
            if (!confirm('Delete this opportunity? This cannot be undone.')) return;
            try {
              const result = await fetch('/api/opportunities/' + encodeURIComponent(data.id), { method: 'DELETE', credentials: 'include' });
              if (result.ok) {
                window.location.href = '/feed?mine=1';
              } else {
                const err = await result.json().catch(() => ({}));
                alert(err.error || 'Failed to delete opportunity.');
              }
            } catch {
              alert('Network error while deleting opportunity.');
            }
          };
        }
      
        if (window.location.hash) {
          setTimeout(() => {
            let target = null;
            if (window.location.hash.startsWith('#comment-')) {
              target = document.getElementById(window.location.hash.substring(1));
            }
            if (!target && window.location.hash === '#comments') {
              target = document.getElementById('comments-list');
            }
            if (target) {
              target.scrollIntoView({ behavior: 'smooth', block: 'center' });
              // Highlight it briefly
              if (window.location.hash.startsWith('#comment-')) {
                const oldBg = target.style.backgroundColor;
                target.style.backgroundColor = 'var(--bg-tertiary)';
                target.style.transition = 'background-color 2s';
                setTimeout(() => { target.style.backgroundColor = oldBg; }, 2000);
              }
            }
          }, 300);
        }
      } catch (error) { console.error('Failed to load opportunity:', error); root.innerHTML = '<div class="d-empty">Could not load this opportunity.</div>'; }
    })();
  </script>
</body>
</html>
