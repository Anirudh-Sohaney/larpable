<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LARPABLE. — Feed</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap');

    :root {
      --bg: #F5F0E8;
      --font: #2D2A26;
      --accent: #E8734A;
      --card: #FFFDF8;
      --border: #D6D1C9;
      --shadow: #C4BEB5;
      --muted: #8A8580;
      --green: #4CAF50;
      --indigo: #5C6BC0;
      --green-bg: rgba(76,175,80,0.08);
      --indigo-bg: rgba(92,107,192,0.08);
      --coral-bg: rgba(232,115,74,0.08);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Space Grotesk', sans-serif; background: var(--bg); color: var(--font); min-height: 100vh; }

    .page {
      max-width: 600px;
      margin: 0 auto;
      padding: 0 20px 60px;
    }

    /* Header */
    .header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 0 12px;
    }
    .logo {
      font-size: 1.2rem; font-weight: 700; color: var(--accent); letter-spacing: 1px; text-decoration: none;
    }
    .header-actions { display: flex; align-items: center; gap: 10px; }
    .btn-ghost {
      background: none; border: 1px solid var(--border); color: var(--font);
      padding: 5px 14px; border-radius: 6px; font-family: inherit; font-size: 0.8rem;
      cursor: pointer; transition: all 0.15s;
    }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
    .user-badge {
      font-size: 0.78rem; color: var(--muted); display: flex; align-items: center; gap: 5px;
    }
    .user-badge span { color: var(--font); font-weight: 500; }

    /* Tabs + Create row */
    .tabs-row {
      display: flex; align-items: center; border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }
    .tabs { display: flex; gap: 0; flex: 1; }
    .tab {
      padding: 8px 16px; font-size: 0.85rem; font-weight: 500;
      border: none; background: none; color: var(--muted);
      cursor: pointer; border-bottom: 2px solid transparent;
      transition: all 0.15s; font-family: inherit;
    }
    .tab:hover { color: var(--font); }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .btn-create {
      background: var(--accent); border: none; color: #fff;
      padding: 5px 12px; border-radius: 6px; font-size: 0.78rem; font-weight: 500;
      cursor: pointer; font-family: inherit; transition: opacity 0.15s;
      white-space: nowrap;
    }
    .btn-create:hover { opacity: 0.9; }

    /* Search & Filters */
    .filters-bar {
      display: none; flex-direction: column; gap: 10px;
      margin-bottom: 16px;
    }
    .filters-bar.visible { display: flex; }
    .search-input {
      width: 100%;
      padding: 10px 14px; border: 1px solid var(--border); border-radius: 6px;
      font-family: inherit; font-size: 0.88rem; background: var(--card);
      color: var(--font); outline: none; transition: border 0.15s;
    }
    .search-input:focus { border-color: var(--accent); }
    .search-input::placeholder { color: var(--muted); }
    .filter-row {
      display: flex; gap: 8px; align-items: stretch;
      min-height: 34px;
    }
    /* Dropdown wrapper */
    .dropdown-wrap { position: relative; flex: 1; min-height: 34px; }
    .dropdown-wrap label {
      display: block; font-size: 0.7rem; color: var(--muted); margin-bottom: 3px;
      font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .filter-toggle {
      width: 100%; height: 34px; padding: 0 12px; border: 1px solid var(--border); border-radius: 6px;
      font-family: inherit; font-size: 0.8rem; background: var(--card);
      color: var(--font); cursor: pointer; text-align: left;
      display: flex; justify-content: space-between; align-items: center;
    }
    .filter-toggle::after {
      content: '\25BE'; font-size: 0.7rem; color: var(--muted); margin-left: auto;
    }
    .filter-toggle:hover { border-color: var(--accent); }
    .filter-dropdown-menu {
      display: none; position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 100;
      background: var(--card); border: 1px solid var(--border); border-radius: 6px;
      max-height: 200px; overflow-y: auto;
      box-shadow: 0 4px 12px var(--shadow);
    }
    .filter-dropdown-menu.open { display: block; }
    .filter-option {
      display: block; width: 100%; padding: 7px 12px; border: none; background: none;
      font-family: inherit; font-size: 0.8rem; color: var(--font);
      cursor: pointer; text-align: left; transition: background 0.1s;
    }
    .filter-option:hover { background: rgba(232,115,74,0.06); }
    .filter-option.selected { background: rgba(232,115,74,0.12); color: var(--accent); font-weight: 500; }
    .filter-option.selected::before { content: '\2713 '; }
    .sort-select {
      width: 100%; height: 34px; padding: 0 12px; border: 1px solid var(--border); border-radius: 6px;
      font-family: inherit; font-size: 0.8rem; background: var(--card);
      color: var(--font); cursor: pointer; outline: none; appearance: auto;
    }
    .sort-select:focus { border-color: var(--accent); }
    .filter-tags {
      display: flex; flex-wrap: wrap; gap: 4px;
    }
    .filter-tag {
      font-size: 0.68rem; padding: 2px 8px; border-radius: 10px;
      background: var(--accent); color: #fff; display: flex; align-items: center; gap: 4px;
    }
    .filter-tag .remove-tag {
      cursor: pointer; font-size: 0.72rem; opacity: 0.7;
    }
    .filter-tag .remove-tag:hover { opacity: 1; }

    /* Content */
    .empty-msg { text-align: center; color: var(--muted); padding: 60px 20px; font-size: 0.9rem; }

    /* Cards */
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 8px;
      padding: 14px 16px; margin-bottom: 10px; cursor: pointer; transition: all 0.15s;
    }
    .card:hover { border-color: var(--accent); box-shadow: 0 2px 8px var(--shadow); }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 5px; }
    .card-title { font-size: 0.95rem; font-weight: 600; color: var(--font); }
    .badge {
      font-size: 0.62rem; font-weight: 600; padding: 2px 7px; border-radius: 12px;
      text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap;
    }
    .badge-project { background: var(--coral-bg); color: var(--accent); }
    .badge-nonprofit { background: var(--green-bg); color: var(--green); }
    .badge-company { background: var(--indigo-bg); color: var(--indigo); }
    .card-issuer { font-size: 0.78rem; color: var(--muted); margin-bottom: 6px; }
    .card-desc { font-size: 0.82rem; color: var(--font); line-height: 1.4; margin-bottom: 8px; }
    .card-meta { display: flex; flex-wrap: wrap; gap: 10px; font-size: 0.72rem; color: var(--muted); margin-bottom: 8px; }
    .card-meta span { display: flex; align-items: center; gap: 3px; }
    .card-skills { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
    .skill-tag {
      font-size: 0.62rem; padding: 2px 7px; border-radius: 10px;
      background: var(--bg); color: var(--muted); border: 1px solid var(--border);
    }
    .card-footer { display: flex; justify-content: space-between; align-items: center; }
    .card-posted { font-size: 0.68rem; color: var(--muted); }
    .card-action {
      font-size: 0.72rem; font-weight: 500; color: var(--accent); text-decoration: none;
    }
    .card-action:hover { text-decoration: underline; }

    /* Your Projects edit/delete */
    .your-card { position: relative; }
    .your-card-actions { position: absolute; top: 10px; right: 10px; display: flex; gap: 5px; }
    .your-card-actions button {
      padding: 3px 8px; border-radius: 4px; font-size: 0.68rem; font-family: inherit;
      cursor: pointer; border: 1px solid var(--border); background: var(--card); color: var(--muted);
      transition: all 0.15s;
    }
    .your-card-actions .edit-btn:hover { border-color: var(--accent); color: var(--accent); }
    .your-card-actions .delete-btn:hover { border-color: #dc3545; color: #dc3545; }
  </style>
</head>
<body>

  <div class="page">
    <div class="header">
      <a href="/feed" class="logo">LARPABLE.</a>
      <div class="header-actions">
        <div class="user-badge"><span id="username-display"></span></div>
        <button class="btn-ghost" onclick="logout()">Log out</button>
      </div>
    </div>

    <div class="tabs-row">
      <div class="tabs">
        <button class="tab active" data-tab="projects">Projects</button>
        <button class="tab" data-tab="nonprofits">Non Profits</button>
        <button class="tab" data-tab="companies">Companies</button>
        <button class="tab" data-tab="yours">Your Projects</button>
      </div>
      <button class="btn-create" onclick="window.location.href='/create_student'">+ Create</button>
    </div>

    <div class="filters-bar visible" id="filters-bar">
      <input class="search-input" type="text" placeholder="Search opportunities..." id="search-input">
      <div class="filter-row">
        <div class="dropdown-wrap" id="filter-dropdown">
          <label>Filters</label>
          <button class="filter-toggle" id="filter-toggle" type="button">Select filters</button>
          <div class="filter-dropdown-menu" id="filter-menu">
            <button type="button" class="filter-option" data-filter="foryou">For you</button>
            <button type="button" class="filter-option" data-filter="nearby">Nearby</button>
            <button type="button" class="filter-option" data-filter="upcoming">Upcoming</button>
            <button type="button" class="filter-option" data-filter="remote">Remote</button>
          </div>
        </div>
        <div class="dropdown-wrap" id="sort-dropdown">
          <label>Sort by</label>
          <select class="sort-select" id="sort-select">
            <option value="">None</option>
            <option value="name-az">Name A-Z</option>
            <option value="name-za">Name Z-A</option>
            <option value="oldest">Oldest</option>
            <option value="recent">Most Recent</option>
          </select>
        </div>
      </div>
      <div class="filter-tags" id="filter-tags"></div>
    </div>

    <div id="feed-list">
      <div class="empty-msg">No opportunities yet.</div>
    </div>
  </div>

  <script>
    let opportunities = [];
    let currentUser = null;
    let userProfile = null; // { skills, interests, location }
    let matchScores = {};   // oppId → score

    // ── AUTH + LOAD ──
    async function checkAuth() {
      try {
        const res = await fetch('/api/auth/me', { credentials: 'include' });
        if (res.ok) {
          const data = await res.json();
          currentUser = data.user;
          document.getElementById('username-display').textContent = currentUser.displayName || currentUser.username || 'User';
          await loadUserProfile();
        } else {
          window.location.href = '/login';
        }
      } catch {
        window.location.href = '/login';
      }
    }

    async function loadUserProfile() {
      try {
        const res = await fetch('/api/users/me', { credentials: 'include' });
        if (res.ok) {
          const data = await res.json();
          const u = data.user || {};
          userProfile = {
            skills: u.skills || [],
            interests: u.interests || [],
            location: parseLocation(u.location)
          };
        }
      } catch (e) {
        console.error('Failed to load user profile:', e);
      }
    }

    function parseLocation(loc) {
      if (!loc) return null;
      if (typeof loc === 'string') {
        try { loc = JSON.parse(loc); } catch { return { city: loc, state: '', country: '' }; }
      }
      return {
        city: loc.city || '',
        state: loc.state || '',
        country: loc.country || '',
        display: loc.display || [loc.city, loc.state, loc.country].filter(Boolean).join(', ')
      };
    }

    async function loadOpportunities() {
      try {
        const res = await fetch('/api/opportunities', { credentials: 'include' });
        if (res.ok) {
          const data = await res.json();
          opportunities = data.opportunities || [];
          await computeMatchScores();
          init();
        }
      } catch (e) {
        console.error('Failed to load opportunities:', e);
      }
    }

    // ── MATCH SCORES ──
    async function computeMatchScores() {
      if (!userProfile || !opportunities.length) return;
      try {
        const res = await fetch('/api/match/rank', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({
            user: { skills: userProfile.skills, interests: userProfile.interests },
            opportunities: opportunities.map(o => ({
              id: o.id,
              skills: o.skills || [],
              industry: o.industry || o.nonprofit_field || '',
              type: o.type
            }))
          })
        });
        if (res.ok) {
          const data = await res.json();
          matchScores = {};
          for (const item of (data.ranked || [])) {
            matchScores[item.opportunity.id] = item.score;
          }
        }
      } catch (e) {
        console.error('Failed to compute match scores:', e);
      }
    }

    // ── TABS ──
    let activeTab = 'projects';
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        activeTab = tab.dataset.tab;
        document.getElementById('filters-bar').classList.toggle('visible', activeTab !== 'yours');
        render();
      });
    });

    // ── SEARCH ──
    const searchInput = document.getElementById('search-input');
    searchInput.addEventListener('input', () => render());

    // ── FILTERS ──
    const filterToggle = document.getElementById('filter-toggle');
    const filterMenu = document.getElementById('filter-menu');
    const filterTags = document.getElementById('filter-tags');
    let activeFilters = [];

    filterToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      filterMenu.classList.toggle('open');
    });

    document.querySelectorAll('.filter-option').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const val = btn.dataset.filter;
        if (activeFilters.includes(val)) {
          activeFilters = activeFilters.filter(f => f !== val);
          btn.classList.remove('selected');
        } else {
          activeFilters.push(val);
          btn.classList.add('selected');
        }
        updateFilterTags();
        render();
      });
    });

    function updateFilterTags() {
      const labels = { foryou: 'For you', nearby: 'Nearby', upcoming: 'Upcoming', remote: 'Remote' };
      filterTags.innerHTML = activeFilters.map(f =>
        `<span class="filter-tag">${labels[f] || f}<span class="remove-tag" onclick="removeFilter('${f}')">&times;</span></span>`
      ).join('');
      filterToggle.textContent = activeFilters.length > 0 ? `${activeFilters.length} selected` : 'Select filters';
    }

    function removeFilter(val) {
      activeFilters = activeFilters.filter(f => f !== val);
      const btn = document.querySelector(`.filter-option[data-filter='${val}']`);
      if (btn) btn.classList.remove('selected');
      updateFilterTags();
      render();
    }

    document.addEventListener('click', (e) => {
      if (!document.getElementById('filter-dropdown').contains(e.target)) filterMenu.classList.remove('open');
    });

    // ── SORT ──
    const sortSelect = document.getElementById('sort-select');
    sortSelect.addEventListener('change', () => render());

    // ── LOCATION HELPERS ──
    function parseOppLocation(loc) {
      if (!loc) return null;
      if (typeof loc === 'string') {
        if (loc.toLowerCase() === 'remote') return { remote: true };
        try { loc = JSON.parse(loc); } catch { return { city: loc, state: '', country: '', remote: false }; }
      }
      return {
        city: loc.city || '',
        state: loc.state || '',
        country: loc.country || '',
        remote: false
      };
    }

    function isNearby(oppLoc) {
      if (!userProfile?.location || !oppLoc || oppLoc.remote) return false;
      const u = userProfile.location;
      const o = oppLoc;
      // Same city
      if (u.city && o.city && u.city.toLowerCase() === o.city.toLowerCase()) return true;
      // Same state + same country
      if (u.state && o.state && u.state.toLowerCase() === o.state.toLowerCase() &&
          u.country && o.country && u.country.toLowerCase() === o.country.toLowerCase()) return true;
      return false;
    }

    // ── RENDER ──
    function render() {
      const container = document.getElementById('feed-list');
      let filtered = opportunities;

      // Tab filter
      if (activeTab === 'projects') filtered = filtered.filter(o => o.type === 'project');
      else if (activeTab === 'nonprofits') filtered = filtered.filter(o => o.type === 'nonprofit');
      else if (activeTab === 'companies') filtered = filtered.filter(o => o.type === 'company');
      else if (activeTab === 'yours') filtered = filtered.filter(o => o.created_by === currentUser?.id);

      // Apply filters
      const hasForYou = activeFilters.includes('foryou');
      const hasNearby = activeFilters.includes('nearby');
      const hasUpcoming = activeFilters.includes('upcoming');
      const hasRemote = activeFilters.includes('remote');

      if (hasForYou) {
        // Score must be ≥ 0.5
        filtered = filtered.filter(o => (matchScores[o.id] || 0) >= 0.5);
      }

      if (hasNearby) {
        filtered = filtered.filter(o => {
          const loc = parseOppLocation(o.location);
          // Must be remote OR in same city/state+country
          return (loc && loc.remote) || isNearby(loc);
        });
      }

      if (hasUpcoming) {
        // Posted within last 7 days
        const sevenDaysAgo = Date.now() - 7 * 24 * 60 * 60 * 1000;
        filtered = filtered.filter(o => {
          if (!o.created_at) return false;
          return new Date(o.created_at).getTime() >= sevenDaysAgo;
        });
      }

      if (hasRemote) {
        filtered = filtered.filter(o => {
          const loc = parseOppLocation(o.location);
          return loc && loc.remote;
        });
      }

      // Search
      const q = searchInput.value.trim().toLowerCase();
      if (q) {
        filtered = filtered.filter(o =>
          (o.title || '').toLowerCase().includes(q) ||
          (o.description || '').toLowerCase().includes(q) ||
          (o.issuer_name || '').toLowerCase().includes(q) ||
          (o.skills || []).some(s => s.toLowerCase().includes(q))
        );
      }

      // Sort
      const sortVal = sortSelect.value;
      if (hasForYou && !sortVal) {
        // Default: sort by match score (highest first)
        filtered.sort((a, b) => (matchScores[b.id] || 0) - (matchScores[a.id] || 0));
      } else if (sortVal === 'name-az') {
        filtered.sort((a, b) => (a.title || '').localeCompare(b.title || ''));
      } else if (sortVal === 'name-za') {
        filtered.sort((a, b) => (b.title || '').localeCompare(a.title || ''));
      } else if (sortVal === 'oldest') {
        filtered.sort((a, b) => new Date(a.created_at || 0) - new Date(b.created_at || 0));
      } else if (sortVal === 'recent') {
        filtered.sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));
      }

      // Render
      if (filtered.length === 0) {
        container.innerHTML = '<div class="empty-msg">No opportunities found.</div>';
        return;
      }

      container.innerHTML = filtered.map(o => {
        const badgeClass = o.type === 'project' ? 'badge-project' : o.type === 'nonprofit' ? 'badge-nonprofit' : 'badge-company';
        const badgeLabel = o.type === 'project' ? 'Project' : o.type === 'nonprofit' ? 'Non-profit' : 'Company';
        const isOwner = o.created_by === currentUser?.id;
        const isYours = activeTab === 'yours';

        const editDelete = isOwner && isYours ? `
          <div class="your-card-actions">
            <button class="edit-btn" onclick="event.stopPropagation(); window.location.href='/create_student?edit=${o.id}'">Edit</button>
            <button class="delete-btn" onclick="event.stopPropagation(); deleteOpportunity('${o.id}')">Delete</button>
          </div>` : '';

        const skillsHtml = (o.skills || []).slice(0, 5).map(s => `<span class="skill-tag">${esc(s)}</span>`).join('');
        const actionLabel = isOwner ? 'View' : 'Learn more';
        const badgeHtml = isYours ? '' : `<span class="badge ${badgeClass}">${badgeLabel}</span>`;
        const score = matchScores[o.id];
        const scoreHtml = (hasForYou && score !== undefined) ? `<span class="skill-tag" style="border-color:var(--accent);color:var(--accent);">${score.toFixed(2)}</span>` : '';

        return `
          <div class="card ${isOwner ? 'your-card' : ''}" onclick="window.location.href='/opportunity?id=${o.id}'">
            ${editDelete}
            <div class="card-header">
              <div class="card-title">${esc(o.title || 'Untitled')}</div>
              ${badgeHtml}
            </div>
            <div class="card-issuer">${esc(o.issuer_name || 'Unknown')}${o.issuer_context ? ' · ' + esc(o.issuer_context) : ''}</div>
            <div class="card-desc">${esc(o.description || '')}</div>
            <div class="card-meta">
              ${o.looking_for ? `<span>👤 ${esc(o.looking_for)}</span>` : ''}
              ${o.location ? `<span>📍 ${esc(o.location)}</span>` : ''}
            </div>
            ${skillsHtml ? `<div class="card-skills">${skillsHtml}${scoreHtml}</div>` : (scoreHtml ? `<div class="card-skills">${scoreHtml}</div>` : '')}
            <div class="card-footer">
              <span class="card-posted">${esc(o.posted || '')}</span>
              <a class="card-action" href="/opportunity?id=${o.id}">${actionLabel} →</a>
            </div>
          </div>`;
      }).join('');
    }

    async function deleteOpportunity(id) {
      if (!confirm('Are you sure you want to delete this opportunity?')) return;
      try {
        const res = await fetch(`/api/opportunities/${id}`, { method: 'DELETE', credentials: 'include' });
        if (res.ok) { opportunities = opportunities.filter(o => o.id !== id); render(); }
        else { alert('Failed to delete.'); }
      } catch { alert('Network error.'); }
    }

    function esc(str) { const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }

    async function logout() {
      await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
      window.location.href = '/loading_page';
    }

    function init() { render(); }
    checkAuth().then(() => loadOpportunities());
  </script>
</body>
</html>
