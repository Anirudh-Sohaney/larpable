<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LARPABLE. — Feed</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="d-header">
    <a href="/feed" class="d-logo">LARPABLE.</a>
    <div class="d-header-right">
      <button class="d-btn d-btn-sm" id="yours-btn" type="button">Your projects</button>
      <a href="/create_student" class="d-btn d-btn-sm" style="font-size:0.82rem;">+ Create</a>
      <div class="d-user-menu">
        <button class="d-user-btn" type="button">
          <span class="d-user-avatar" id="header-avatar"></span>
          <span class="d-user-name" id="header-username"></span>
        </button>
        <div class="d-user-dropdown">
          <a href="/profile">My Profile</a>
          <a href="/staff" id="staff-portal-link" style="display:none;">Staff Portal</a>
          <hr>
          <button onclick="App.logout()">Log out</button>
        </div>
      </div>
    </div>
  </header>
  <main class="d-feed">
    <div class="d-search-wrap"><input class="d-search" id="q" placeholder="Search projects, organizations, skills" autocomplete="off"></div>
    <div class="d-filter-row">
      <select class="d-select-pill" id="f-type"><option value="">All types</option><option value="project">Projects</option><option value="nonprofit">Nonprofits</option><option value="company">Companies</option></select>
      <div class="d-dd" id="dd-skill"><button class="d-select-pill" id="btn-skill" type="button">Any skill</button><div class="d-dd-menu" id="menu-skill" hidden><input class="d-dd-search" id="search-skill" placeholder="Search skills"><div class="d-dd-list" id="list-skill"></div><div class="d-dd-foot"><span id="tally-skill"></span><button data-clear type="button">Clear</button></div></div></div>
      <div class="d-dd" id="dd-field"><button class="d-select-pill" id="btn-field" type="button">Any field</button><div class="d-dd-menu" id="menu-field" hidden><input class="d-dd-search" id="search-field" placeholder="Search fields"><div class="d-dd-list" id="list-field"></div><div class="d-dd-foot"><span id="tally-field"></span><button data-clear type="button">Clear</button></div></div></div>
      <select class="d-select-pill" id="f-sort"><option value="foryou">For you</option><option value="closest">Closest</option><option value="recent">Newest first</option><option value="oldest">Oldest first</option><option value="name-az">A–Z</option></select>
      <button class="d-filter-clear" id="clear" hidden>Clear</button>
    </div>
    <p class="d-count" id="count">Loading</p><div id="list"></div>
  </main>
  <footer class="d-page-footer">LARPABLE. — made for students, by students.</footer>
  <script src="/synonyms.js"></script><script src="/js/utils.js"></script><script src="/js/data.js"></script><script src="/js/app.js"></script><script src="/js/filters.js"></script><script src="/js/feed.js"></script>
  <script>
    (async () => {
      await App.init();
      if (!App.requireAuth()) return;
      App.setupUserMenu();
      await Filters.init();
      await Feed.init();
    })();
  </script>
</body>
</html>
