<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LARPABLE. — Staff Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="staff_styles.css">
  <!--
    INTEGRATION:
    In the real app, this would be /app/staff/staff.html
    Protected by server.js: requires authentication + staff role
    CSS uses .sp- namespace to avoid conflicts with main app styles
  -->
</head>
<body>

  <div class="sp-app">
    <!-- ═══ HEADER ═══════════════════════════════════════════ -->
    <header class="sp-header">
      <div class="sp-header-left">
        <a href="../feed.html" class="sp-logo">LARPABLE.</a>
        <div class="sp-header-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input type="text" placeholder="Search everything..." id="global-search" oninput="App.globalSearch(this.value)">
        </div>
      </div>
      <div class="sp-header-right">
        <span class="sp-user-badge">
          <span class="sp-admin-badge" id="admin-badge" style="display:none;">Admin</span>
          <strong id="header-username">anisohaney</strong>
        </span>
        <span id="user-switcher" style="display:none;"></span>
        <a href="../feed.html" class="sp-btn" style="text-decoration:none;">Main Site</a>
      </div>
    </header>

    <!-- ═══ SIDEBAR ══════════════════════════════════════════ -->
    <nav class="sp-sidebar" id="sidebar">
      <div class="sp-nav-section-label">Overview</div>
      <button class="sp-nav-item active" data-tab="home" onclick="App.navigate('home')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span class="sp-nav-label">Home</span>
      </button>
      <button class="sp-nav-item" data-tab="calendar" onclick="App.navigate('calendar')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <span class="sp-nav-label">Calendar</span>
      </button>

      <div class="sp-nav-divider"></div>
      <div class="sp-nav-section-label">Work</div>
      <button class="sp-nav-item" data-tab="goals" onclick="App.navigate('goals')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
        <span class="sp-nav-label">Goals</span>
      </button>
      <button class="sp-nav-item" data-tab="tasks" onclick="App.navigate('tasks')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        <span class="sp-nav-label">Tasks</span>
      </button>
      <button class="sp-nav-item" data-tab="work" id="work-nav" style="display:none;" onclick="App.navigate('work')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
        <span class="sp-nav-label">Work</span>
      </button>

      <div class="sp-nav-divider"></div>
      <div class="sp-nav-section-label">Insights</div>
      <button class="sp-nav-item" data-tab="logs" onclick="App.navigate('logs')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        <span class="sp-nav-label">Logs</span>
      </button>
      <button class="sp-nav-item" data-tab="resources" onclick="App.navigate('resources')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        <span class="sp-nav-label">Resources</span>
      </button>

      <div class="sp-nav-divider" id="admin-divider" style="display:none;"></div>
      <div class="sp-nav-section-label" id="admin-section-label" style="display:none;">Admin</div>
      <button class="sp-nav-item" data-tab="admin" id="admin-nav" style="display:none;" onclick="App.navigate('admin')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span class="sp-nav-label">Admin</span>
      </button>
    </nav>

    <!-- ═══ MAIN CONTENT ═════════════════════════════════════ -->
    <main class="sp-content" id="main-content">
      <!-- Content rendered by JS components -->
    </main>

    <!-- ═══ MOBILE BOTTOM NAV ════════════════════════════════ -->
    <nav class="sp-bottom-nav" id="bottom-nav">
      <button class="sp-bottom-nav-item active" data-tab="home" onclick="App.navigate('home')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Home</span>
      </button>
      <button class="sp-bottom-nav-item" data-tab="goals" onclick="App.navigate('goals')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
        <span>Goals</span>
      </button>
      <button class="sp-bottom-nav-item" data-tab="tasks" onclick="App.navigate('tasks')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        <span>Tasks</span>
      </button>
      <button class="sp-bottom-nav-item" data-tab="logs" onclick="App.navigate('logs')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        <span>Logs</span>
      </button>
      <button class="sp-bottom-nav-item" data-tab="more" onclick="App.toggleMobileMore()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg>
        <span>More</span>
      </button>
    </nav>
  </div>

  <!-- ═══ MODALS ═════════════════════════════════════════════ -->
  <!-- Add/Edit Goal Modal -->
  <div class="sp-modal-overlay" id="goal-modal">
    <div class="sp-modal">
      <div class="sp-modal-header">
        <h3 class="sp-modal-title" id="goal-modal-title">Add Goal</h3>
        <button class="sp-modal-close" onclick="App.closeModal('goal-modal')">&times;</button>
      </div>
      <form id="goal-form" onsubmit="App.handleGoalSubmit(event)">
        <input type="hidden" id="goal-edit-id">
        <input type="hidden" id="goal-type">
        <input type="hidden" id="goal-user-id">
        <div class="sp-form-group">
          <label class="sp-form-label">Title</label>
          <input type="text" class="sp-form-input" id="goal-title" required>
        </div>
        <div class="sp-form-group">
          <label class="sp-form-label">Description</label>
          <input type="text" class="sp-form-input" id="goal-description">
        </div>
        <div class="sp-form-group">
          <label class="sp-form-label">Deadline</label>
          <input type="date" class="sp-form-input" id="goal-deadline" required>
        </div>
        <div class="sp-form-group" id="goal-importance-group" style="display:none;">
          <label class="sp-form-label">Importance</label>
          <div class="sp-radio-group">
            <label class="sp-radio-label"><input type="radio" name="goal-importance" value="high"> High</label>
            <label class="sp-radio-label"><input type="radio" name="goal-importance" value="medium" checked> Medium</label>
            <label class="sp-radio-label"><input type="radio" name="goal-importance" value="low"> Low</label>
          </div>
        </div>
        <div class="sp-form-actions">
          <button type="button" class="sp-btn" onclick="App.closeModal('goal-modal')">Cancel</button>
          <button type="submit" class="sp-btn sp-btn-primary" id="goal-submit-btn">Add Goal</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Add Task Modal -->
  <div class="sp-modal-overlay" id="task-modal">
    <div class="sp-modal">
      <div class="sp-modal-header">
        <h3 class="sp-modal-title">Add Task</h3>
        <button class="sp-modal-close" onclick="App.closeModal('task-modal')">&times;</button>
      </div>
      <form id="task-form" onsubmit="App.handleTaskSubmit(event)">
        <div class="sp-form-group">
          <label class="sp-form-label">Title</label>
          <input type="text" class="sp-form-input" id="task-title" required>
        </div>
        <div class="sp-form-group">
          <label class="sp-form-label">Description</label>
          <input type="text" class="sp-form-input" id="task-description">
        </div>
        <div class="sp-form-group">
          <label class="sp-form-label">Assign To <span style="color:var(--sp-muted);font-weight:400;">(select one or more)</span></label>
          <select class="sp-form-select" id="task-assignee" multiple size="4"></select>
        </div>
        <div class="sp-form-group">
          <label class="sp-form-label">Priority</label>
          <div class="sp-radio-group">
            <label class="sp-radio-label"><input type="radio" name="task-priority" value="high"> High</label>
            <label class="sp-radio-label"><input type="radio" name="task-priority" value="medium" checked> Medium</label>
            <label class="sp-radio-label"><input type="radio" name="task-priority" value="low"> Low</label>
          </div>
        </div>
        <div class="sp-form-group">
          <label class="sp-form-label">Due Date</label>
          <input type="date" class="sp-form-input" id="task-due-date" required>
        </div>
        <div class="sp-form-actions">
          <button type="button" class="sp-btn" onclick="App.closeModal('task-modal')">Cancel</button>
          <button type="submit" class="sp-btn sp-btn-primary">Add Task</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Add Event Modal -->
  <div class="sp-modal-overlay" id="event-modal">
    <div class="sp-modal">
      <div class="sp-modal-header">
        <h3 class="sp-modal-title">Add Event</h3>
        <button class="sp-modal-close" onclick="App.closeModal('event-modal')">&times;</button>
      </div>
      <form id="event-form" onsubmit="App.handleEventSubmit(event)">
        <div class="sp-form-group">
          <label class="sp-form-label">Title</label>
          <input type="text" class="sp-form-input" id="event-title" required>
        </div>
        <div class="sp-form-group">
          <label class="sp-form-label">Date</label>
          <input type="date" class="sp-form-input" id="event-date" required>
        </div>
        <div class="sp-form-group">
          <label class="sp-form-label">Time</label>
          <input type="time" class="sp-form-input" id="event-time" required>
        </div>
        <div class="sp-form-group">
          <label class="sp-form-label">Duration (minutes, 0 = all day)</label>
          <input type="number" class="sp-form-input" id="event-duration" value="60" min="0">
        </div>
        <div class="sp-form-group">
          <label class="sp-form-label">Type</label>
          <select class="sp-form-select" id="event-type">
            <option value="meeting">Meeting</option>
            <option value="milestone">Milestone</option>
            <option value="deadline">Deadline</option>
          </select>
        </div>
        <div class="sp-form-group">
          <label class="sp-form-label">Description</label>
          <input type="text" class="sp-form-input" id="event-description">
        </div>
        <div class="sp-form-actions">
          <button type="button" class="sp-btn" onclick="App.closeModal('event-modal')">Cancel</button>
          <button type="submit" class="sp-btn sp-btn-primary">Add Event</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Add Resource Modal -->
  <div class="sp-modal-overlay" id="resource-modal">
    <div class="sp-modal">
      <div class="sp-modal-header">
        <h3 class="sp-modal-title">Add Resource</h3>
        <button class="sp-modal-close" onclick="App.closeModal('resource-modal')">&times;</button>
      </div>
      <form id="resource-form" onsubmit="App.handleResourceSubmit(event)">
        <div class="sp-form-group">
          <label class="sp-form-label">Title</label>
          <input type="text" class="sp-form-input" id="resource-title" required>
        </div>
        <div class="sp-form-group">
          <label class="sp-form-label">URL</label>
          <input type="url" class="sp-form-input" id="resource-url" required>
        </div>
        <div class="sp-form-group">
          <label class="sp-form-label">Description</label>
          <input type="text" class="sp-form-input" id="resource-description">
        </div>
        <div class="sp-form-group">
          <label class="sp-form-label">Label</label>
          <select class="sp-form-select" id="resource-label">
            <option>Tech</option><option>Backend</option><option>Frontend</option><option>Design</option><option>Operations</option><option>Marketing</option><option>Research</option><option>People &amp; Culture</option>
          </select>
        </div>
        <div class="sp-form-actions">
          <button type="button" class="sp-btn" onclick="App.closeModal('resource-modal')">Cancel</button>
          <button type="submit" class="sp-btn sp-btn-primary">Add Resource</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Add Staff Member Modal -->
  <div class="sp-modal-overlay" id="staff-modal">
    <div class="sp-modal">
      <div class="sp-modal-header">
        <h3 class="sp-modal-title">Add Staff Member</h3>
        <button class="sp-modal-close" onclick="App.closeModal('staff-modal')">&times;</button>
      </div>
      <div class="sp-form-group">
        <label class="sp-form-label">Username</label>
        <input type="text" class="sp-form-input" id="staff-username-input" placeholder="Enter username...">
      </div>
      <div class="sp-form-group">
        <label class="sp-form-label">First Name</label>
        <input type="text" class="sp-form-input" id="staff-firstname-input">
      </div>
      <div class="sp-form-actions">
        <button type="button" class="sp-btn" onclick="App.closeModal('staff-modal')">Cancel</button>
        <button type="button" class="sp-btn sp-btn-primary" onclick="App.handleAddStaff()">Add Member</button>
      </div>
    </div>
  </div>

  <!-- Day Detail Slide Panel (Calendar) -->
  <div class="sp-modal-overlay" id="day-modal">
    <div class="sp-modal">
      <div class="sp-modal-header">
        <h3 class="sp-modal-title" id="day-modal-title">Events</h3>
        <button class="sp-modal-close" onclick="App.closeModal('day-modal')">&times;</button>
      </div>
      <div id="day-modal-content"></div>
    </div>
  </div>

  <!-- Mobile More Menu -->
  <div class="sp-modal-overlay" id="more-modal">
    <div class="sp-modal" style="padding:0;">
      <div style="padding:16px 20px; border-bottom:1px solid var(--sp-border);">
        <strong>More</strong>
      </div>
      <button class="sp-nav-item" data-tab="calendar" onclick="App.navigate('calendar'); App.closeModal('more-modal');">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <span class="sp-nav-label">Calendar</span>
      </button>
      <button class="sp-nav-item" data-tab="resources" onclick="App.navigate('resources'); App.closeModal('more-modal');">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        <span class="sp-nav-label">Resources</span>
      </button>
      <button class="sp-nav-item" id="more-work-nav" style="display:none;" data-tab="work" onclick="App.navigate('work'); App.closeModal('more-modal');">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
        <span class="sp-nav-label">Work</span>
      </button>
      <button class="sp-nav-item" id="more-admin-nav" style="display:none;" data-tab="admin" onclick="App.navigate('admin'); App.closeModal('more-modal');">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span class="sp-nav-label">Admin</span>
      </button>
    </div>
  </div>

  <!-- Scripts -->
  <script src="staff_utils.js"></script>
  <script src="staff_data.js"></script>
  <script src="components/home.js"></script>
  <script src="components/calendar.js"></script>
  <script src="components/goals.js"></script>
  <script src="components/tasks.js"></script>
  <script src="components/work.js"></script>
  <script src="components/logs.js"></script>
  <script src="components/resources.js"></script>
  <script src="components/admin.js"></script>
  <script src="staff_app.js"></script>
</body>
</html>
