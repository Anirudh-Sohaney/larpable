<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LARPABLE. — Staff Dashboard</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap');

    :root {
      --bg: #F5F0E8;
      --font: #2D2A26;
      --accent: #E8734A;
      --card: #FFFDF8;
      --border: #D6D1C9;
      --shadow: #C4BEB5;
      --muted: #8A8580;
      --green: #4CAF50;
      --indigo: #5C6BC0;
      --green-bg: rgba(76,175,80,0.08);
      --indigo-bg: rgba(92,107,192,0.08);
      --coral-bg: rgba(232,115,74,0.08);
      --high-bg: rgba(220,53,69,0.08);
      --high-color: #dc3545;
      --medium-bg: rgba(255,193,7,0.08);
      --medium-color: #ffc107;
      --low-bg: rgba(40,167,69,0.08);
      --low-color: #28a745;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Space Grotesk', sans-serif; background: var(--bg); color: var(--font); min-height: 100vh; overflow-x: hidden; }

    .page {
      width: 600px;
      margin: 0 auto;
      padding: 0 20px 60px;
    }

    /* Header */
    .header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 0 12px;
    }
    .logo {
      font-size: 1.2rem; font-weight: 700; color: var(--accent); letter-spacing: 1px; text-decoration: none;
    }
    .header-actions { display: flex; align-items: center; gap: 10px; }
    .btn-ghost {
      background: none; border: 1px solid var(--border); color: var(--font);
      padding: 5px 14px; border-radius: 6px; font-family: inherit; font-size: 0.8rem;
      cursor: pointer; transition: all 0.15s;
    }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
    .user-badge {
      font-size: 0.78rem; color: var(--muted); display: flex; align-items: center; gap: 5px;
    }
    .user-badge span { color: var(--font); font-weight: 500; }

    /* Tabs */
    .tabs-row {
      display: flex; align-items: center; border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }
    .tabs { display: flex; gap: 0; flex: 1; }
    .tab {
      padding: 8px 16px; font-size: 0.85rem; font-weight: 500;
      border: none; background: none; color: var(--muted);
      cursor: pointer; border-bottom: 2px solid transparent;
      transition: all 0.15s; font-family: inherit;
    }
    .tab:hover { color: var(--font); }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    /* Cards */
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 8px;
      padding: 14px 16px; margin-bottom: 10px; transition: all 0.15s;
    }
    .card:hover { border-color: var(--accent); box-shadow: 0 2px 8px var(--shadow); }

    /* Stats Cards */
    .stats-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 8px;
      padding: 16px; text-align: center;
    }
    .stat-number {
      font-size: 3.2rem; font-weight: 700; color: var(--accent);
      line-height: 1;
    }
    .stat-label {
      font-size: 0.85rem; color: var(--muted); text-transform: uppercase;
      letter-spacing: 0.5px; margin-top: 6px; font-weight: 500;
    }
    .stat-breakdown {
      font-size: 0.75rem; color: var(--muted); margin-top: 8px;
      text-align: left;
    }
    .stat-breakdown div {
      display: flex; justify-content: space-between;
      padding: 2px 0;
    }

    /* Goal Cards */
    .goal-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 8px;
      padding: 14px 16px; margin-bottom: 10px; position: relative;
    }
    .goal-card.completed {
      opacity: 0.7;
      border-style: dashed;
    }
    .goal-header {
      display: flex; justify-content: space-between; align-items: flex-start;
      margin-bottom: 8px;
    }
    .goal-title {
      font-size: 0.95rem; font-weight: 600; color: var(--font);
      flex: 1;
    }
    .goal-title.completed {
      text-decoration: line-through;
      color: var(--muted);
    }
    .goal-description {
      font-size: 0.82rem; color: var(--font); line-height: 1.4;
      margin-bottom: 8px;
    }
    .goal-meta {
      display: flex; flex-wrap: wrap; gap: 10px; font-size: 0.72rem; color: var(--muted);
    }
    .goal-meta span {
      display: flex; align-items: center; gap: 3px;
    }
    .goal-actions {
      display: flex; gap: 6px; margin-top: 10px;
    }
    .goal-actions button {
      padding: 4px 10px; border-radius: 4px; font-size: 0.72rem; font-family: inherit;
      cursor: pointer; border: 1px solid var(--border); background: var(--card);
      color: var(--muted); transition: all 0.15s;
    }
    .goal-actions .complete-btn:hover { border-color: var(--green); color: var(--green); }
    .goal-actions .edit-btn:hover { border-color: var(--accent); color: var(--accent); }
    .goal-actions .delete-btn:hover { border-color: #dc3545; color: #dc3545; }

    /* Importance Badges */
    .importance-badge {
      font-size: 0.62rem; font-weight: 600; padding: 2px 7px; border-radius: 12px;
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .importance-high { background: var(--high-bg); color: var(--high-color); }
    .importance-medium { background: var(--medium-bg); color: var(--medium-color); }
    .importance-low { background: var(--low-bg); color: var(--low-color); }

    /* Timeline */
    .timeline {
      position: relative;
      padding-left: 24px;
    }
    .timeline::before {
      content: '';
      position: absolute;
      left: 8px;
      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--border);
    }
    .timeline-item {
      position: relative;
      margin-bottom: 20px;
    }
    .timeline-item::before {
      content: '';
      position: absolute;
      left: -20px;
      top: 6px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--card);
      border: 2px solid var(--border);
    }
    .timeline-item.completed::before {
      background: var(--green);
      border-color: var(--green);
    }

    /* Log Cards */
    .log-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 8px;
      padding: 12px 14px; margin-bottom: 8px; font-family: monospace;
      font-size: 0.78rem;
    }
    .log-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 6px;
    }
    .log-timestamp {
      font-size: 0.72rem; color: var(--muted);
    }
    .log-type {
      font-size: 0.62rem; font-weight: 600; padding: 2px 7px; border-radius: 12px;
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .log-type.team_goal { background: var(--coral-bg); color: var(--accent); }
    .log-type.user_goal { background: var(--indigo-bg); color: var(--indigo); }
    .log-type.staff { background: var(--green-bg); color: var(--green); }
    .log-type.git_push { background: rgba(138,133,128,0.15); color: var(--muted); }
    .log-action {
      font-size: 0.68rem; color: var(--muted); margin-bottom: 4px;
    }
    .log-details {
      color: var(--font);
    }

    /* Search */
    .search-input {
      width: 100%;
      padding: 10px 14px; border: 1px solid var(--border); border-radius: 6px;
      font-family: inherit; font-size: 0.88rem; background: var(--card);
      color: var(--font); outline: none; transition: border 0.15s;
      margin-bottom: 12px;
    }
    .search-input:focus { border-color: var(--accent); }
    .search-input::placeholder { color: var(--muted); }

    /* Dropdown */
    .dropdown-wrap { position: relative; margin-bottom: 12px; }
    .dropdown-toggle {
      width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 6px;
      font-family: inherit; font-size: 0.88rem; background: var(--card);
      color: var(--font); cursor: pointer; text-align: left;
      display: flex; justify-content: space-between; align-items: center;
    }
    .dropdown-toggle::after {
      content: '\25BE'; font-size: 0.7rem; color: var(--muted); margin-left: auto;
    }
    .dropdown-toggle:hover { border-color: var(--accent); }
    .dropdown-menu {
      display: none; position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 100;
      background: var(--card); border: 1px solid var(--border); border-radius: 6px;
      max-height: 200px; overflow-y: auto;
      box-shadow: 0 4px 12px var(--shadow);
    }
    .dropdown-menu.open { display: block; }
    .dropdown-option {
      display: block; width: 100%; padding: 8px 12px; border: none; background: none;
      font-family: inherit; font-size: 0.8rem; color: var(--font);
      cursor: pointer; text-align: left; transition: background 0.1s;
    }
    .dropdown-option:hover { background: rgba(232,115,74,0.06); }

    /* Buttons */
    .btn-primary {
      background: var(--accent); border: none; color: #fff;
      padding: 8px 16px; border-radius: 6px; font-size: 0.82rem; font-weight: 500;
      cursor: pointer; font-family: inherit; transition: opacity 0.15s;
    }
    .btn-primary:hover { opacity: 0.9; }

    .btn-secondary {
      background: none; border: 1px solid var(--border); color: var(--font);
      padding: 8px 16px; border-radius: 6px; font-size: 0.82rem; font-weight: 500;
      cursor: pointer; font-family: inherit; transition: all 0.15s;
    }
    .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }

    /* Modal */
    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--card); border-radius: 12px; padding: 24px;
      width: 400px; max-width: 90%; max-height: 80vh; overflow-y: auto;
    }
    .modal-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 20px;
    }
    .modal-title {
      font-size: 1.1rem; font-weight: 600;
    }
    .modal-close {
      background: none; border: none; font-size: 1.2rem; cursor: pointer;
      color: var(--muted); transition: color 0.15s;
    }
    .modal-close:hover { color: var(--font); }
    .form-group {
      margin-bottom: 16px;
    }
    .form-label {
      display: block; font-size: 0.78rem; font-weight: 500; color: var(--muted);
      margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .form-input {
      width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 6px;
      font-family: inherit; font-size: 0.88rem; background: var(--card);
      color: var(--font); outline: none; transition: border 0.15s;
    }
    .form-input:focus { border-color: var(--accent); }
    .form-actions {
      display: flex; gap: 10px; justify-content: flex-end;
      margin-top: 24px;
    }

    /* Radio buttons */
    .radio-group {
      display: flex; gap: 12px;
    }
    .radio-label {
      display: flex; align-items: center; gap: 6px;
      font-size: 0.85rem; cursor: pointer;
    }
    .radio-label input[type="radio"] {
      accent-color: var(--accent);
    }

    /* Empty state */
    .empty-msg {
      text-align: center; color: var(--muted); padding: 60px 20px; font-size: 0.9rem;
    }

    /* Section headers */
    .section-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 16px;
    }
    .section-title {
      font-size: 1rem; font-weight: 600;
    }

    /* Last updated */
    .last-updated {
      font-size: 0.72rem; color: var(--muted); text-align: center;
      margin-top: 12px;
    }

    /* User goals section (for anisohaney) */
    .staff-section {
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
    }
    .staff-section-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 16px;
    }
    .staff-section-title {
      font-size: 0.95rem; font-weight: 600; color: var(--accent);
    }
  </style>
</head>
<body>

  <div class="page" data-scale-target="600">
    <div class="header">
      <a href="/feed" class="logo">LARPABLE.</a>
      <div id="header-actions"></div>
    </div>

    <div class="tabs-row">
      <div class="tabs">
        <button class="tab active" data-tab="home">Home</button>
        <button class="tab" data-tab="team">Team</button>
        <button class="tab" data-tab="me">Me</button>
        <button class="tab" data-tab="logs">Logs</button>
      </div>
    </div>

    <div id="tab-content">
      <!-- Content loaded dynamically -->
    </div>
  </div>

  <!-- Add Goal Modal -->
  <div class="modal-overlay" id="add-goal-modal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title" id="goal-modal-title">Add Goal</h3>
        <button class="modal-close" onclick="closeModal('add-goal-modal')">&times;</button>
      </div>
      <form id="goal-form">
        <div class="form-group">
          <label class="form-label">Title</label>
          <input type="text" class="form-input" id="goal-title" required>
        </div>
        <div class="form-group">
          <label class="form-label">Description</label>
          <input type="text" class="form-input" id="goal-description">
        </div>
        <div class="form-group">
          <label class="form-label">Deadline</label>
          <input type="date" class="form-input" id="goal-deadline" required>
        </div>
        <div class="form-group" id="importance-group" style="display: none;">
          <label class="form-label">Importance</label>
          <div class="radio-group">
            <label class="radio-label">
              <input type="radio" name="importance" value="high"> High
            </label>
            <label class="radio-label">
              <input type="radio" name="importance" value="medium" checked> Medium
            </label>
            <label class="radio-label">
              <input type="radio" name="importance" value="low"> Low
            </label>
          </div>
        </div>
        <div class="form-actions">
          <button type="button" class="btn-secondary" onclick="closeModal('add-goal-modal')">Cancel</button>
          <button type="submit" class="btn-primary" id="goal-submit-btn">Add Goal</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Add Staff Member Modal -->
  <div class="modal-overlay" id="add-staff-modal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">Add Staff Member</h3>
        <button class="modal-close" onclick="closeModal('add-staff-modal')">&times;</button>
      </div>
      <div class="form-group">
        <label class="form-label">Search Users</label>
        <input type="text" class="form-input" id="staff-search-input" placeholder="Search by username or name...">
      </div>
      <div id="staff-search-results" style="max-height: 200px; overflow-y: auto; margin-bottom: 16px;">
        <!-- Results loaded dynamically -->
      </div>
      <div class="form-actions">
        <button type="button" class="btn-secondary" onclick="closeModal('add-staff-modal')">Cancel</button>
        <button type="button" class="btn-primary" id="add-staff-submit-btn" disabled>Add Member</button>
      </div>
    </div>
  </div>

  <!-- Edit Goal Modal -->
  <div class="modal-overlay" id="edit-goal-modal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">Edit Goal</h3>
        <button class="modal-close" onclick="closeModal('edit-goal-modal')">&times;</button>
      </div>
      <form id="edit-goal-form">
        <input type="hidden" id="edit-goal-id">
        <input type="hidden" id="edit-goal-type">
        <input type="hidden" id="edit-goal-user-id">
        <div class="form-group">
          <label class="form-label">Title</label>
          <input type="text" class="form-input" id="edit-goal-title" required>
        </div>
        <div class="form-group">
          <label class="form-label">Description</label>
          <input type="text" class="form-input" id="edit-goal-description">
        </div>
        <div class="form-group">
          <label class="form-label">Deadline</label>
          <input type="date" class="form-input" id="edit-goal-deadline" required>
        </div>
        <div class="form-group" id="edit-importance-group" style="display: none;">
          <label class="form-label">Importance</label>
          <div class="radio-group">
            <label class="radio-label">
              <input type="radio" name="edit-importance" value="high"> High
            </label>
            <label class="radio-label">
              <input type="radio" name="edit-importance" value="medium" checked> Medium
            </label>
            <label class="radio-label">
              <input type="radio" name="edit-importance" value="low"> Low
            </label>
          </div>
        </div>
        <div class="form-actions">
          <button type="button" class="btn-secondary" onclick="closeModal('edit-goal-modal')">Cancel</button>
          <button type="submit" class="btn-primary">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/user-dropdown.js"></script>
  <script src="/scaling.js"></script>
  <script src="/staff/staff.js"></script>
</body>
</html>
